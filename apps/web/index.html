<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        const preference = localStorage.getItem('novel-tool-theme') || 'dark';
        const resolved = preference === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : preference;
        const themeColors = { dark: '#0f1115', light: '#f8f9fc' };
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
        document.documentElement.lang = localStorage.getItem('novel-tool-language') === 'en' ? 'en' : 'vi';
        document.documentElement.dataset.accent = localStorage.getItem('novel-tool-accent') || 'indigo';
        document.documentElement.dataset.density = localStorage.getItem('novel-tool-density') === 'comfortable' ? 'comfortable' : 'compact';
        const appFont = localStorage.getItem('novel-tool-app-font');
        document.documentElement.dataset.appFont = ['small', 'medium', 'large', 'extra-large'].includes(appFont) ? appFont : 'medium';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', themeColors[resolved]);
        try {
          const reader = JSON.parse(localStorage.getItem('novel-tool-reader') || '{}');
          document.documentElement.dataset.readerFont = reader.fontSize || 'medium';
          document.documentElement.dataset.readerLine = reader.lineHeight || 'comfortable';
          document.documentElement.dataset.readerParagraph = reader.paragraphSpacing || 'normal';
          document.documentElement.dataset.readerFamily = reader.fontFamily || 'serif';
          document.documentElement.dataset.readerWeight = reader.fontWeight || 'regular';
          document.documentElement.dataset.readerMargin = reader.pageMargin || 'normal';
          document.documentElement.dataset.readerAlign = reader.alignment || 'left';
          document.documentElement.dataset.readerIndent = String(Boolean(reader.indent));
          document.documentElement.dataset.readerHyphen = String(Boolean(reader.hyphenation));
          document.documentElement.dataset.readerDropcap = String(Boolean(reader.dropCap));
        } catch {}
      })();
    </script>
    <title>Novel Tool</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
